<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/books.css">
        <script src="../components/header.js" defer></script>
        <script src="../components/footer.js" defer></script>
        <script src="../components/formBooks.js" defer></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <title>Bücher</title>
    </head>
    <body>
        <header>
            <web-component-header></web-component-header>
        </header>

        <main>
            <section>
                <h1>Bücher</h1>
                <div class="textContainer">
                    <p>
                        Ich habe schon früh angefangen zu lesen. Seither ist es eines meiner grössten
                        Hobbys.
                    </p>
                    <p>
                        Meine liebsten Genres sind Fantasy, Romanzen und Abendteuer.
                    </p>
                </div>
            </section>

            <section>
                <h2 id="booklistHeading">Meine Bücherliste</h2>

                <div class="bookGallery">
                    <article class="book">
                        <img src="../images/books/shadowFalls_1.jpg" alt="Cover des Buches Shadow Falls Camp - Geboren um Mitternacht von Amazon.de">
                        <p>Status: Gelesen</p>
                    </article>
                </div>
                <div class="bookGallery">
                    <article class="book">
                        <img src="../images/books/shadowFalls_2.jpg" alt="Cover des Buches Shadow Falls Camp - Erwacht im Morgengrauen von Amazon.de">
                        <p>Status: Gelesen</p>
                    </article>
                </div>
                <div class="bookGallery">
                    <article class="book">
                        <img src="../images/books/shadowFalls_3.jpg" alt="Cover des Buches Shadow Falls Camp - Entführt in der Dämmerung von Amazon.de">
                        <p>Status: reading</p>
                    </article>
                </div>
                <div class="bookGallery">
                    <article class="book">
                        <img src="../images/books/dragonGames_1.jpg" alt="Cover des Buches Dragon Games - Herz aus Feuer von Amazon.de">
                        <p>Status: TBR (To be read)</p>
                    </article>
                </div>
            </section>

            <section>
                <h2>Was sind eure Lieblingsgenres?</h2>

                <div class="inputContainer">
                    <form id="bookForm">
                        <label for="genre">Genre:</label>
                        <input type="text" id="genre" name="genre" required>

                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name">

                        <button type="submit" >
                             Senden
                        </button>
                    </form>
                </div>
            </section>
        </main>

        <footer>
            <web-component-footer></web-component-footer>
        </footer>
    </body>
</html>
