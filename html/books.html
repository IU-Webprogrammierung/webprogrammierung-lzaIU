<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <script src="https://cdn.tailwindcss.com"></script>
        <script src="../tailwind.config.js"></script>

        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/books.css">

        <script src="../components/header.js" defer></script>
        <script src="../components/footer.js" defer></script>
        <script src="../components/formBooks.js" defer></script>

        <title>Bücher</title>
        <link rel="icon" href="../images/favicon.png" type="image/x-icon">
    </head>
    <body>
        <header>
            <web-component-header></web-component-header>
        </header>

        <main class="desktop:grid desktop:grid-cols-3 desktop:gap-8 desktop:items-start">
            <section class="desktop:col-start-1 desktop:flex desktop:flex-col desktop:gap-6 desktop:bg-accent/35
                        desktop:rounded-2xl desktop:shadow-xl desktop:p-8 desktop:sticky desktop:top-8">
                <h1 class="desktop:text-4xl desktop:text-primary desktop:font-medium desktop:mb-4">Bücher</h1>
                <div class="textContainer">
                    <p>
                        Ich habe schon früh angefangen zu lesen. Seither ist es eines meiner grössten
                        Hobbys.
                    </p>
                    <p>
                        Meine liebsten Genres sind Fantasy, Romanzen und Abenteuer.
                    </p>
                </div>
            </section>

            <section class="desktop:col-start-2 desktop:grid desktop:grid-cols-2 desktop:gap-6 desktop:bg-accent/35 desktop:rounded-2xl desktop:shadow-xl desktop:p-8">
                <h2 id="booklistHeading" class="desktop:col-span-2 desktop:text-2xl desktop:font-semibold desktop:mb-4">Meine Bücherliste</h2>

                <div class="bookGallery">
                    <article class="book desktop:hover:-translate-y-2 desktop:transition-transform">
                        <img src="../images/books/shadowFalls_1.jpg" alt="Cover Shadow Falls 1" class="desktop:w-full">
                        <p>Status: Gelesen</p>
                    </article>
                </div>
                <div class="bookGallery">
                    <article class="book desktop:hover:-translate-y-2 desktop:transition-transform">
                        <img src="../images/books/shadowFalls_2.jpg" alt="Cover Shadow Falls 2" class="desktop:w-full">
                        <p>Status: Gelesen</p>
                    </article>
                </div>
                <div class="bookGallery">
                    <article class="book desktop:hover:-translate-y-2 desktop:transition-transform">
                        <img src="../images/books/shadowFalls_3.jpg" alt="Cover Shadow Falls 3" class="desktop:w-full">
                        <p>Status: reading</p>
                    </article>
                </div>
                <div class="bookGallery">
                    <article class="book desktop:hover:-translate-y-2 desktop:transition-transform">
                        <img src="../images/books/dragonGames_1.jpg" alt="Cover Dragon Games" class="desktop:w-full">
                        <p>Status: TBR (To be read)</p>
                    </article>
                </div>
            </section>

            <section class="desktop:col-start-3 desktop:bg-accent/35 desktop:rounded-2xl desktop:shadow-xl p-8 desktop:sticky desktop:top-8">
                <h2 class="desktop:text-2xl desktop:font-semibold desktop:mb-6">Was sind eure Lieblingsgenres?</h2>

                <div class="inputContainer">
                    <form id="bookForm" class="desktop:flex desktop:flex-col desktop:gap-4">
                        <label for="genre">Genre:</label>
                        <input type="text" id="genre" name="genre" required>

                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name">

                        <button type="submit" class="p-[0.6rem] rounded-[0.5rem] border-none cursor-pointer
                                                    bg-accent text-primary text-[2.5vw]
                                                    desktop:w-full desktop:text-lg desktop:hover:brightness-110 transition-all">
                            Senden
                        </button>
                    </form>
                </div>
            </section>
        </main>

        <footer>
            <web-component-footer></web-component-footer>
        </footer>
    </body>
</html>
